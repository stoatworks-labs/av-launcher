# openrcs — control surface for Analog Way LiveCore / Midra / PLS300 /
# LivePremier / Midra 4K / Alta 4K processors.
# https://github.com/stoatworks-labs/openrcs
#
#   AV_LAUNCHER_CONFIG=launchers/openrcs.toml npm run tauri dev
#
# Development reference only. The shipped openRCS tray app is built from the
# copy of this shell in openrcs's own repo (launcher/), by that repo's release
# workflow, with openrcs-server bundled as a resource — the way flock and
# srt-router ship theirs. The config there is the one that counts; keep this
# in step with it.
#
# The launcher only chooses where the surface listens: {host}:{port} is the
# server's own listen address. Which switcher to drive, and which model it is,
# are set in the surface's Connection view and persisted by the server, so
# there are no custom fields here to keep in step with its platform list.

[app]
name = "openRCS"
command = "/Users/allansargeant/Projects/video/openrcs/target/debug/openrcs-server"
args = ["--listen", "{host}:{port}"]
url = "http://{host}:{port}/"
default_port = 8730
cwd = "/Users/allansargeant/Projects/video/openrcs"

[inject]
mode = "args"

# Palette mirrored from openrcs's web UI (near-black + cyan accent).
[app.theme]
bg = "#0d1015"
panel = "#151a21"
"panel-2" = "#1b222c"
border = "#242c37"
text = "#e6ebf2"
muted = "#8b96a5"
dim = "#5b6673"
accent = "#22b8cf"
"accent-soft" = "#12414d"
good = "#3fb950"
