name: release

# Build the AV Launcher tray app and publish installable artefacts.
#
# Tauri's bundler shells out to host-only tooling and cannot cross-compile, so
# every platform builds on its own native runner. That is also what makes the
# Linux .deb/.AppImage possible at all — they cannot be produced from a Mac.
#
# Unlike the launchers embedded in flock/srt-router/RFutils, this repo is the
# reusable shell on its own: there is no server binary to stage, so the build is
# just `tauri build`.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust cross-compiles between the two macOS arches unaided, so both
          # build on the same runner; the Intel runners are retired anyway.
          # Tauri's universal-apple-darwin target builds both and lipos them, so
          # macOS ships ONE installer that runs on any Mac.
          #
          # universal-apple-darwin is a Tauri *bundling* target and not a rustup
          # one, so the toolchain step installs `rust_targets` (the real triples)
          # while `target` stays what tauri build is given and what names the
          # output directory.
          - { name: macos-universal, os: macos-14,       target: universal-apple-darwin,   rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin', bundles: app }
          - { name: linux-x86_64,    os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, rust_targets: x86_64-unknown-linux-gnu, bundles: 'deb,appimage' }
          - { name: windows-x86_64,  os: windows-latest, target: x86_64-pc-windows-msvc,   rust_targets: x86_64-pc-windows-msvc,   bundles: 'nsis,msi' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: 'src-tauri -> target'

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Derive version
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(node -p "require('./package.json').version")" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        # working-directory is not used here because package.json is at the
        # repo root; `npx --prefix` would not work either — npx has no such
        # flag and resolves the local bin against the current directory.
        run: |
          npm install --no-audit --no-fund
          npx --no-install tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # The x86_64 job is a cross-compile, so its target directory holds both
      # host and target artefacts, and the .app is then copied into the staging
      # dir and the disk image in turn. In the vendored copies of this workflow
      # that also embed a Node runtime (~111 MB), that was enough to exhaust the
      # runner: hdiutil failed with "No space left on device" while the aarch64
      # job, with the same payload, was fine. The bundle is already built by
      # this point; the intermediates are not needed again.
      - name: Reclaim disk before packaging
        if: runner.os == 'macOS'
        shell: bash
        # The universal build compiles under the two REAL triples and lipos the
        # result into target/universal-apple-darwin, so the intermediates worth
        # deleting are the per-arch ones — twice as much as before, on the job
        # that already ran a runner out of space once. The merged bundle under
        # ${{ matrix.target }} is what packaging needs; leave it alone.
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            d="src-tauri/target/$t/release"
            rm -rf "$d/build" "$d/deps" "$d/incremental" "$d/.fingerprint"
          done
          df -h / | tail -1

      # Proof that "universal" is universal. A build that lost a slice looks
      # identical in the log and the asset is named the same either way, which
      # is how simplecue once published an arm64-only macos-universal asset.
      #
      # Captured and matched with `case`, never piped into grep: this runs as
      # `bash -eo pipefail`, so grep exiting at its first match SIGPIPEs lipo
      # and fails the step BECAUSE the match was found.
      - name: Verify the macOS bundle is universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          appdir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="AV Launcher.app"
          if [ ! -d "$appdir/$app" ]; then echo "no .app produced" >&2; exit 1; fi
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appdir/$app/Contents/Info.plist")"
          __archs="$( lipo -archs "$appdir/$app/Contents/MacOS/$exe" )"
          echo "$app/Contents/MacOS/$exe: $__archs"
          case "$__archs" in
            *arm64*) ;;
            *) echo "expected an arm64 slice, got: $__archs" >&2; exit 1 ;;
          esac
          case "$__archs" in
            *x86_64*) ;;
            *) echo "expected an x86_64 slice, got: $__archs" >&2; exit 1 ;;
          esac

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Tauri's own dmg step drives Finder over AppleScript and fails on a
        # headless runner, so the image is built here. Ad-hoc signing first:
        # x86_64 binaries are not linker-signed and a wholly unsigned bundle is
        # refused with "is damaged and can't be opened".
        run: |
          source scripts/release-lib.sh
          rl_init "AV Launcher" av-launcher "${{ steps.ver.outputs.version }}" \
            com.stoatworks.av-launcher "$GITHUB_WORKSPACE"
          appdir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="AV Launcher.app"
          if [ ! -d "$appdir/$app" ]; then echo "no .app produced" >&2; exit 1; fi
          stage="$RUNNER_TEMP/stage-mac"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R "$appdir/$app" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          rl_adhoc_sign "$stage/$app"
          rl_dmg "${{ matrix.name }}" "$stage" --app "$app"
          rl_pkg "${{ matrix.name }}" "$stage" --app "$app"

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          cp *.dmg *.pkg out/ 2>/dev/null || true
          ls -la out || true

      - uses: actions/upload-artifact@v7
        with:
          name: av-launcher-${{ matrix.name }}
          path: out/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body: |
            The reusable tray-launcher shell on its own. The per-app builds that
            embed a server live in their own repos (flock, srt-router, RFutils,
            atem-overseer, atem-fleet-admin).

            **macOS** — `.pkg` installs into /Applications; `.dmg` lets you drag it.
            One universal build: the same file runs on Apple Silicon and Intel.

            **Windows** — `-setup.exe` (NSIS) and `.msi`, x86_64.

            **Linux** — `.deb` and `.AppImage`, x86_64.

            Builds are unsigned. On macOS, after installing:

            ```
            xattr -dr com.apple.quarantine "/Applications/AV Launcher.app"
            ```
          generate_release_notes: true
