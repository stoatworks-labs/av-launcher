name: ci

# Until this existed the repo had only tag-triggered workflows, so no pull
# request ever got a status check: Dependabot bumps arrived with nothing to gate
# a merge on. Both open bumps are cargo ones under /src-tauri, which is what
# this checks.
#
# There is no npm job, and that is not an oversight: package-lock.json is not
# committed, so `npm ci` cannot run at all here — release.yml uses `npm install`
# for the same reason. The only npm dependency is @tauri-apps/cli. Committing
# the lockfile is tracked separately; a web job can be added once it exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # The tauri crate links against webkit2gtk on Linux, so even `cargo check`
      # needs the development headers — without them the build fails in
      # pkg-config, long before any of this repo's own code is compiled. Same
      # list release.yml installs for its Linux target.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      # `cargo fmt --check` is deliberately not a step: it is already failing on
      # main, and gating every bump on pre-existing formatting drift would block
      # the PRs this workflow exists to unblock. Run `cargo fmt --all` in
      # src-tauri once, then add it.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: test
        run: cargo test
        working-directory: src-tauri
